spring.application.name=fullstack-backend
server.port=5000
spring.profiles.active=prod
jwt.secret=mySecretKeyForJWTTokenGenerationFullstackReactApplicationSuperSecure2024LevelUpGamer
jwt.expiration=86400000
logging.level.root=INFO
logging.level.com.levelup=DEBUG
logging.level.org.springframework.security=DEBUG
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
aws.s3.bucket-name=bucket-levelup
aws.region=us-east-1
spring.datasource.url=jdbc:...

